services:
  api:
    build: .
    environment:
      PORT: 8000
      DRONE_OPS_DB: /data/clearance.db
    volumes:
      - clearance-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 5
    ports:
      - "8000:8000"
volumes:
  clearance-data:
